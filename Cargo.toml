[package]
name = "secure-database"
version = "0.1.0"
edition = "2021"
description = "Hardened PostgreSQL database access with attested credential rotation"
autobins = false

[lib]
name = "secure_database"
path = "src/lib.rs"

[[bin]]
name = "secure-database-cli"
path = "src/bin/secure-database-cli.rs"
required-features = ["migrate"]

[features]
default = []
citus = []
timescaledb = []
pgaudit = []
pg-stat-statements = []
otel = ["dep:opentelemetry-jaeger", "dep:tracing-opentelemetry"]
tee-dstack = ["dep:dstack-sdk"]
zk-halo2 = ["dep:halo2_proofs", "dep:ff", "dep:rand", "dep:once_cell"]
migrate = ["dep:clap"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
base64 = "0.22"
broker-protocol-client = { package = "secret-broker-client", path = "../secret-broker/crates/secret-broker-client" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"], optional = true }
dcap-qvl = "0.3"
dstack-sdk = { version = "0.1.1", optional = true }
ff = { version = "0.13", optional = true }
halo2_proofs = { git = "https://github.com/zcash/halo2", rev = "32a87582dfb0ad9364ef3ffe71751ceab2a502ea", optional = true }
hex = "0.4"
hmac = "0.12"
hyper-util = { version = "0.1", features = ["tokio"] }
metrics = "0.21"
once_cell = { version = "1.19", optional = true }
opentelemetry-jaeger = { version = "0.22", optional = true }
rand = { version = "0.8", features = ["std"], optional = true }
ring = { version = "0.17", features = ["std"] }
rustls = "0.23"
rustls-pemfile = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde-human-bytes = "0.1"
serde_json = "1.0"
sha2 = "0.10"
spiffe = "0.6.7"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "macros", "migrate"] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-rustls = "0.26"
tonic = { version = "0.14.2", features = ["transport", "tls-webpki-roots"] }
tower = "0.5"
tracing = "0.1"
tracing-opentelemetry = { version = "0.24", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
x509-parser = "0.16"
yasna = "0.5"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"
